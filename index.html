// ============================================================
// FUNÇÕES DO FLUXOGRAMA
// ============================================================
const trackEl = document.getElementById('track-wp');
const svgEl = document.getElementById('edges-wp');
const panelEl = document.getElementById('panel-wp');
const panelBodyEl = document.getElementById('panelBody-wp');
const overlayEl = document.getElementById('overlay-wp');
const closeBtnEl = document.getElementById('closeBtn-wp');

// Monta colunas por fase
for (let p = 1; p <= 10; p++) {
  const col = document.createElement('div');
  col.className = 'semester';
  col.innerHTML = '<div class="semester-tab"><span class="num">'+p+'</span> '+p+'º Fase</div>';
  coursesOdonto.filter(c => c.period === p).forEach(c => {
    const card = document.createElement('div');
    card.className = 'card';
    card.id = 'card-wp-' + c.id;
    card.innerHTML = '<div class="code">'+c.id+'</div><div class="name">'+c.name+'</div><div class="credits">'+c.total+' cr.</div>';
    card.addEventListener('click', () => selectCourse(c.id));
    col.appendChild(card);
  });
  trackEl.appendChild(col);
}

// Constrói arestas (pré-requisitos e correquisitos)
const edgesList = [];
coursesOdonto.forEach(c => {
  if (c.prereq) {
    c.prereq.forEach(p => {
      edgesList.push({ from: p, to: c.id, type: 'prereq' });
    });
  }
  if (c.coreq) {
    c.coreq.forEach(p => {
      edgesList.push({ from: p, to: c.id, type: 'coreq' });
    });
  }
});

function drawEdges() {
  const rect = trackEl.getBoundingClientRect();
  svgEl.setAttribute('width', trackEl.scrollWidth);
  svgEl.setAttribute('height', trackEl.scrollHeight);
  svgEl.innerHTML = '';
  
  edgesList.forEach(e => {
    const fromEl = document.getElementById('card-wp-' + e.from);
    const toEl = document.getElementById('card-wp-' + e.to);
    if (!fromEl || !toEl) return;
    
    const r1 = fromEl.getBoundingClientRect();
    const r2 = toEl.getBoundingClientRect();
    
    const x1 = r1.right - rect.left;
    const y1 = r1.top + r1.height/2 - rect.top;
    const x2 = r2.left - rect.left;
    const y2 = r2.top + r2.height/2 - rect.top;
    
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    
    if (e.type === 'coreq') {
      const centerX1 = r1.left + r1.width/2 - rect.left;
      const centerX2 = r2.left + r2.width/2 - rect.left;
      const topY2 = r2.top - rect.top;
      const bottomY1 = r1.bottom - rect.top;
      
      if (r2.top > r1.top) {
        path.setAttribute('d', 'M '+centerX1+' '+bottomY1+' L '+centerX2+' '+topY2);
      } else {
        const topY1 = r1.top - rect.top;
        const bottomY2 = r2.bottom - rect.top;
        path.setAttribute('d', 'M '+centerX1+' '+topY1+' L '+centerX2+' '+bottomY2);
      }
      path.dataset.type = 'coreq';
      path.classList.add('coreq-line');
    } else {
      const cx1 = x1 + (x2 - x1) * 0.5;
      const cx2 = x2 - (x2 - x1) * 0.5;
      path.setAttribute('d', 'M '+x1+' '+y1+' C '+cx1+' '+y1+', '+cx2+' '+y2+', '+x2+' '+y2);
      path.dataset.type = 'prereq';
      path.classList.add('edge');
    }
    
    path.dataset.from = e.from;
    path.dataset.to = e.to;
    svgEl.appendChild(path);
  });
}

window.addEventListener('load', () => setTimeout(drawEdges, 200));
window.addEventListener('resize', () => requestAnimationFrame(drawEdges));

function getDirectPrereqs(id) {
  const result = new Set();
  edgesList.filter(e => e.to === id && e.type === 'prereq').forEach(e => {
    result.add(e.from);
  });
  return result;
}

function getDirectCoreqs(id) {
  const result = new Set();
  edgesList.filter(e => e.to === id && e.type === 'coreq').forEach(e => {
    result.add(e.from);
  });
  return result;
}

function selectCourse(id) {
  const course = coursesOdonto.find(c => c.id === id);
  if (!course) return;
  
  document.querySelectorAll('#fluxograma-wp .card').forEach(el => el.classList.remove('selected','prereq','coreq','dim'));
  document.querySelectorAll('#fluxograma-wp .edge, #fluxograma-wp .coreq-line').forEach(el => el.classList.remove('highlight','coreq-highlight','dim'));
  
  const directPrereqs = getDirectPrereqs(id);
  const directCoreqs = getDirectCoreqs(id);
  const allRelated = new Set([...directPrereqs, ...directCoreqs, id]);
  
  document.querySelectorAll('#fluxograma-wp .card').forEach(el => {
    const cid = el.id.replace('card-wp-','');
    if (!allRelated.has(cid)) el.classList.add('dim');
  });
  
  const sel = document.getElementById('card-wp-'+id);
  if (sel) sel.classList.add('selected');
  
  directPrereqs.forEach(a => { 
    const el = document.getElementById('card-wp-'+a); 
    if(el) el.classList.add('prereq'); 
  });
  
  directCoreqs.forEach(a => { 
    const el = document.getElementById('card-wp-'+a); 
    if(el) el.classList.add('coreq'); 
  });
  
  document.querySelectorAll('#fluxograma-wp .edge, #fluxograma-wp .coreq-line').forEach(el => {
    const from = el.dataset.from;
    const to = el.dataset.to;
    const isPrereqRelated = directPrereqs.has(from) && to === id;
    const isCoreqRelated = directCoreqs.has(from) && to === id;
    
    if (isPrereqRelated) {
      el.classList.add('highlight');
    } else if (isCoreqRelated) {
      el.classList.add('coreq-highlight');
    } else {
      el.classList.add('dim');
    }
  });

  const total = course.total || 0;
  const teorico = course.teorico || 0;
  const lab = course.lab || 0;
  const clinico = course.clinico || 0;
  let credDetail = '';
  const parts = [];
  if(teorico > 0) parts.push('Teórico: '+teorico+' cr.');
  if(lab > 0) parts.push('Laboratório: '+lab+' cr.');
  if(clinico > 0) parts.push('Clínico: '+clinico+' cr.');
  if(parts.length) credDetail = '<div class="p-credits-detail">'+parts.join(' · ')+'</div>';

  const metaInfo = '<div class="p-meta"><strong>Caráter:</strong> '+(course.carater || 'Não informado')+'<br><strong>Departamento:</strong> '+(course.dept || 'Não informado')+'</div>';

  const prereqList = (course.prereq && course.prereq.length) ? 
    '<ul>'+course.prereq.map(p => {
      const found = coursesOdonto.find(c => c.id === p);
      return '<li onclick="selectCourse(\''+p+'\')">'+(found ? found.name : p)+' <span class="tag-prereq">'+p+'</span></li>';
    }).join('')+'</ul>' : '<p class="empty">Nenhum pré-requisito.</p>';

  const coreqList = (course.coreq && course.coreq.length) ? 
    '<ul>'+course.coreq.map(p => {
      const found = coursesOdonto.find(c => c.id === p);
      return '<li class="coreq-item" onclick="selectCourse(\''+p+'\')">'+(found ? found.name : p)+' <span class="tag-coreq">'+p+'</span></li>';
    }).join('')+'</ul>' : '<p class="empty">Nenhum correquisito.</p>';

  const objEspList = (course.objEsp && course.objEsp.length) ? 
    '<ul>'+course.objEsp.map(o => '<li>'+o+'</li>').join('')+'</ul>' : '<p class="empty">Não informado.</p>';
  
  const biblioObrig = course.biblioObrig ? course.biblioObrig.replace(/\n/g,'<br>') : '<span class="empty">Não informado.</span>';
  const biblioComp = course.biblioComp ? course.biblioComp.replace(/\n/g,'<br>') : '<span class="empty">Não informado.</span>';
  const equiv = course.equiv || '<span class="empty">Não informado.</span>';

  panelBodyEl.innerHTML = `
    <div class="p-code">${course.id} · ${course.period}º Fase</div>
    <div class="p-name">${course.name}</div>
    <div class="p-credits">${total} créditos totais</div>
    ${credDetail}
    ${metaInfo}
    <h3>Pré-requisitos</h3>
    <div class="block prereq-list">${prereqList}</div>
    <h3>Correquisitos</h3>
    <div class="block coreq-list">${coreqList}</div>
    <h3>Ementa</h3>
    <div class="block">${course.desc || 'Não informado.'}</div>
    <h3>Objetivo Geral</h3>
    <div class="block">${course.objGeral || 'Não informado.'}</div>
    <h3>Objetivos Específicos</h3>
    <div class="block">${objEspList}</div>
    <h3>Bibliografia Obrigatória</h3>
    <div class="block">${biblioObrig}</div>
    <h3>Bibliografia Complementar</h3>
    <div class="block">${biblioComp}</div>
    <h3>Equivalências</h3>
    <div class="block">${equiv}</div>
  `;
  panelEl.classList.add('open');
  overlayEl.classList.add('open');
}

function closePanel() {
  panelEl.classList.remove('open');
  overlayEl.classList.remove('open');
  document.querySelectorAll('#fluxograma-wp .card').forEach(el => el.classList.remove('selected','prereq','coreq','dim'));
  document.querySelectorAll('#fluxograma-wp .edge, #fluxograma-wp .coreq-line').forEach(el => el.classList.remove('highlight','coreq-highlight','dim'));
}

closeBtnEl.addEventListener('click', closePanel);
overlayEl.addEventListener('click', closePanel);
</script>
